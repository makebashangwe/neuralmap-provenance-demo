[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralmap-public-demo"
version = "0.1.0"
description = "Privacy-safe synthetic demonstration of the NeuralMap / Provenance architecture."
requires-python = ">=3.11"
authors = [
  {name = "Makeba Waddy"}
]

[tool.setuptools.packages.find]
where = ["src"]
